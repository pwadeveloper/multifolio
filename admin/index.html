<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multimudia · Work manager</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><main><header><div><p class="eyebrow">MULTIMUDIA / PRIVATE STUDIO</p><h1>Manage your work.</h1><p>Add a link. Preview it. Put it in your portfolio.</p></div><a href="http://localhost:8778/design" target="_blank" rel="noopener">View portfolio ↗</a></header><div class="layout"><section class="panel"><h2 id="form-heading">Add new work</h2><form id="work-form"><input type="hidden" id="work-id"><label for="url">YouTube or Instagram link</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" required maxlength="2048"><button type="button" id="preview-button" class="secondary">Preview link</button><label for="title">Title</label><input id="title" required maxlength="120" placeholder="A name for this piece"><label for="category">Show under</label><select id="category"><option value="Reels">Reels · vertical</option><option value="Youtube">Youtube · horizontal</option></select><p class="hint">Use public posts with embedding enabled. Private or restricted videos may only open on their original platform.</p><div class="actions"><button type="submit" id="save">Add to portfolio</button><button type="button" id="cancel" class="secondary" hidden>Cancel edit</button></div></form><p id="status" role="status" aria-live="polite"></p><div id="preview"></div></section><section><div class="list-heading"><h2>Your embeds</h2><span id="count"></span></div><div id="works"></div></section></div></main></body></html>
